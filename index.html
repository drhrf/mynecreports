<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My NEC Reports</title>
  <link rel="stylesheet" href="style.css">

  <!-- SDK modular do Firebase via CDN -->
  <script type="module" src="scripts/app.js"></script>
</head>

<body>
  <header>
    <h1>Portal de Relatórios NEC</h1>
    <p>Acesse seus documentos com segurança</p>
  </header>

  <main>
    <section id="auth-section">
      <div class="card">
        <h2>Criar conta</h2>
        <form id="registerForm">
          <input type="email" name="email" placeholder="E-mail" required>
          <input type="password" name="password" placeholder="Senha" required>
          <button type="submit">Cadastrar</button>
        </form>
      </div>

      <div class="card">
        <h2>Entrar</h2>
        <form id="loginForm">
          <input type="email" name="email" placeholder="E-mail" required>
          <input type="password" name="password" placeholder="Senha" required>
          <button type="submit">Login</button>
        </form>
      </div>
    </section>

    <section id="user-section" class="hidden">
      <h2>Bem-vindo!</h2>
      <p id="userEmail"></p>
      <button id="logoutBtn">Sair</button>
      <div id="pdfArea" class="card">
        <h3>Seu relatório:</h3>
        <div id="pdfLink">Carregando...</div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 My NEC Reports — Todos os direitos reservados.</p>
  </footer>
</body>
</html>
